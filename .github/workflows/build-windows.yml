name: Build Windows Installer & Portable (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Renderer, Electron & Windows Executables
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows .exe Artifacts (Installateur + Portable)
        uses: actions/upload-artifact@v7
        with:
          name: MyBrowser-Windows-x64
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30

      - name: Publish GitHub Release (on tag v* or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
